# تست restore بکاپ دیتابیس Supabase پروژه ml-course-v2 (پیشنهاد ۳)
#
# وضعیت: بکاپ سبز است (ران 45613199138، آرتیفکت ml-course-v2-db-backup).
# ورودی backup_run_id شمارهٔ اجرای سبز ورک‌فلوی backup است
# (تب Actions ← backup).
#
# روش: آرتیفکت بکاپ را دانلود می‌کند، روی یک Postgres موقت postgres:17
# در همین رانر restore می‌کند (فقط اسکیمای public)، و ۵ چک قبولی را می‌زند.
# پیش از restore، رول‌های مخصوص سوپابیس (anon/authenticated/service_role/
# supabase_admin) و یک جدول stub ‏auth.users ساخته می‌شوند، چون دامپ
# --schema=public به آن‌ها ارجاع می‌دهد (GRANTها و FKها به auth.users)
# ولی در Postgres ساده وجود ندارند — بدون این stubها pg_restore با
# ۵۶ خطا می‌افتد در حالی که دادهٔ public خودش سالم restore می‌شود.
# هیچ‌چیز به دیتابیس زنده وصل نمی‌شود — صفر ریسک برای دادهٔ زنده.
# رانر موقت است: با پایان جاب، کانتینر Postgres و فایل‌ها از بین می‌روند.
#
# چرا restore روی پروژهٔ خراش Supabase انجام نمی‌شود: پلن Free دقیقاً
# ۲ پروژهٔ فعال می‌دهد و یاسین ۲ پروژه دارد؛ پس هدف تست همین رانر است.
name: restore-test

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Run ID of a green backup workflow run (Actions tab -> backup -> run number)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  restore-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - name: Download backup artifact
        uses: actions/download-artifact@v4
        with:
          name: ml-course-v2-db-backup
          path: backup
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for test Postgres
        run: |
          set -euo pipefail
          # Client tools come from the same postgres:17 image the backup
          # workflow uses — no reliance on runner-installed psql.
          # --network host: the service container is reachable on
          # localhost:5432 through its mapped port.
          for i in $(seq 1 30); do
            if docker run --rm --network host postgres:17 \
              pg_isready -h localhost -p 5432 -U postgres; then
              echo "test postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "test postgres did not become ready" >&2
          exit 1

      - name: Create Supabase stubs (roles + auth.users)
        env:
          PGPASSWORD: testonly
        run: |
          set -euo pipefail
          # The dump is --schema=public but references Supabase-only objects
          # plain postgres:17 cannot resolve: GRANT / ALTER DEFAULT
          # PRIVILEGES to roles anon/authenticated/supabase_admin, and FKs
          # from public tables to auth.users(id). Without these stubs
          # pg_restore fails with 56 errors (roles + schema auth missing)
          # even though the public data itself restores fine.
          # A fresh container per run makes CREATE ROLE safe; the DO blocks
          # keep the step idempotent if it ever runs twice.
          # -i is REQUIRED: without it docker drops the heredoc stdin and
          # psql exits 0 having run nothing (hit 2026-11-25: the stubs step
          # went green while pg_restore still reported the same 56 errors).
          docker run --rm -i --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            psql -h localhost -U postgres -d postgres \
              -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'supabase_admin') THEN
              CREATE ROLE supabase_admin NOLOGIN;
            END IF;
          END $$;
          SQL
          echo "supabase stubs created"
          # Verify the stubs actually landed in the test DB (visible in the
          # log): -c needs no stdin, so this cannot silently no-op.
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            psql -h localhost -U postgres -d postgres -tAc \
              "SELECT 'role:' || rolname FROM pg_roles WHERE rolname IN ('anon','authenticated','service_role','supabase_admin') ORDER BY 1"
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            psql -h localhost -U postgres -d postgres -tAc \
              "SELECT 'auth.users table: ' || count(*) FROM pg_tables WHERE schemaname = 'auth' AND tablename = 'users'"

      - name: Restore public schema only
        env:
          PGPASSWORD: testonly
        run: |
          set -euo pipefail
          # Resolve the dump filename on the host first: a bare /backup/*.dump
          # would NOT expand inside the container (docker passes args without
          # a shell) and the host shell cannot see the mounted path either.
          DUMP_FILE=$(ls backup/*.dump 2>/dev/null | head -n 1)
          if [ -z "$DUMP_FILE" ]; then
            echo "no .dump file found in backup/ — did the artifact download succeed?" >&2
            ls -la backup/ || true
            exit 1
          fi
          echo "restoring $DUMP_FILE"
          # --schema=public: the dump covers the whole `postgres` database
          # and includes Supabase internal schemas (auth/storage) that need
          # Supabase-only extensions (e.g. pgjwt) absent from plain
          # postgres:17. --no-owner: owner names differ on a fresh instance.
          docker run --rm --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            -v "$PWD/backup:/backup" \
            postgres:17 \
            pg_restore --schema=public --no-owner \
              -h localhost -U postgres -d postgres "/backup/$(basename "$DUMP_FILE")"
          echo "pg_restore done"

      - name: Acceptance checks (all five must pass)
        env:
          PGPASSWORD: testonly
        run: |
          set -euo pipefail
          # -i is REQUIRED here too: without it docker drops the heredoc
          # stdin and psql exits 0 having checked nothing (false green).
          docker run --rm -i --network host \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            psql -h localhost -U postgres -d postgres \
              -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            n_tables int;
            n_keys int;
            n_members int;
          BEGIN
            -- 1) exactly 9 tables in public
            SELECT count(*) INTO n_tables FROM pg_tables WHERE schemaname = 'public';
            IF n_tables <> 9 THEN
              RAISE EXCEPTION 'expected 9 tables in public, got %', n_tables;
            END IF;
            -- 2) 168 quiz answer keys (162 phase 2 + 6 day zero, per seed files)
            SELECT count(*) INTO n_keys FROM quiz_answer_keys;
            IF n_keys <> 168 THEN
              RAISE EXCEPTION 'expected 168 quiz_answer_keys, got %', n_keys;
            END IF;
            -- 3) 2 members (teacher + student)
            SELECT count(*) INTO n_members FROM members;
            IF n_members <> 2 THEN
              RAISE EXCEPTION 'expected 2 members, got %', n_members;
            END IF;
            -- 4) both functions exist in public
            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname = 'submit_quiz_attempt'
            ) THEN
              RAISE EXCEPTION 'function submit_quiz_attempt missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public' AND p.proname = 'verify_studio_ticket'
            ) THEN
              RAISE EXCEPTION 'function verify_studio_ticket missing';
            END IF;
            -- 5) RLS enabled on every regular table in public
            IF EXISTS (
              SELECT 1 FROM pg_class
              WHERE relnamespace = 'public'::regnamespace
                AND relkind = 'r' AND NOT relrowsecurity
            ) THEN
              RAISE EXCEPTION 'some public table has RLS disabled';
            END IF;
            RAISE NOTICE 'restore-test checks passed: 9 tables, 168 keys, 2 members, both functions, RLS on';
          END $$;
          SQL
