# Keep-alive پروژه Supabase ml-course-v2 (پلن رایگان)
# سوپابیس پروژه‌های رایگان را پس از ۷ روز بی‌فعالیتی متوقف می‌کند؛
# این ورک‌فلو هر ۳ روز یک بار به نقطهٔ سلامت Auth سر می‌زند تا پروژه زنده بماند.
# هیچ رازی لازم نیست — آدرس پروژه عمومی است (در کد فرانت‌اند هم هست).
name: keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *' # هر ۳ روز، ساعت ۰۶:۰۰ UTC (~۰۹:۳۰ تهران)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # نقطهٔ سلامت Auth این پروژه بدون هدر apikey خطای ۴۰۱ می‌دهد؛
      # کلید publishable عمومی است (در باندل فرانت‌اند هم هست) و راز نیست.
      - name: Ping Supabase Auth health
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" \
            -H "apikey: sb_publishable_P0eahb5LUuuZKJlKrIuaYA_HWvKZGGM" \
            "https://awznimzcsmpaadvqwodg.supabase.co/auth/v1/health")
          echo "HTTP $code"
          cat /tmp/health.json
          test "$code" = "200"
